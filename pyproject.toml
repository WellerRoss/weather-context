[project]
name = "weather-context"
version = "0.1.0"
description = "Generic historical/forecast weather lookup by lat/lon, backed by Open-Meteo, with a local SQLite cache. No API key required, no ecosystem-specific assumptions."
authors = [
    { name = "Ross Weller", email = "jwellerross@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "typer>=0.27.1",
]

[project.scripts]
wx = "weather_context.cli:app"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "respx>=0.22.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
